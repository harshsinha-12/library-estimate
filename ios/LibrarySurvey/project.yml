name: LibrarySurvey
options:
  bundleIdPrefix: dev.harshsinha
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: PH4KQ4LY92
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  LibrarySurvey:
    type: application
    platform: iOS
    sources:
      - LibrarySurvey
    info:
      path: LibrarySurvey/Resources/Info.plist
      properties:
        CFBundleDisplayName: Library Survey
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Camera access captures RoomPlan geometry and synchronized survey evidence.
        NSPhotoLibraryUsageDescription: Photo access lets you choose an exception close-up when a camera is unavailable.
        NSMicrophoneUsageDescription: Microphone access records technician notes on the survey timeline.
        NSLocationWhenInUseUsageDescription: Location suggests the survey country, city, currency, and pricing market.
        NSLocalNetworkUsageDescription: Local network access uploads sealed survey packages to the development backend.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - "_http._tcp"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.harshsinha.LibrarySurvey
        PRODUCT_NAME: LibrarySurvey
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
