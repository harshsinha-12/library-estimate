[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "library-roomplan"
version = "0.1.0"
description = "Evidence-first library survey capture and valuation backend"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "redis>=5.2,<6",
  "reportlab>=5,<6",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.26,<3",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
yolo = [
  "ultralytics>=8.3,<9",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<12",
]

[tool.setuptools.packages.find]
include = ["backend*", "cv*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
